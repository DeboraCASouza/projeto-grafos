<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Grafo Interativo — Rede Aeroportuária</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; height: 100vh; background: #0F172A; color: #E2E8F0; overflow: hidden; }
    
    #sidebar {
      width: 340px; background: #1E293B; border-right: 1px solid #334155;
      display: flex; flex-direction: column; padding: 20px; z-index: 1000;
      overflow-y: auto;
    }
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    h1 { font-size: 18px; color: #F1F5F9; margin-bottom: 5px; }
    p.sub { font-size: 12px; color: #94A3B8; margin-bottom: 20px; }
    
    .control-group { margin-bottom: 20px; }
    label { font-size: 11px; font-weight: bold; color: #94A3B8; text-transform: uppercase; margin-bottom: 8px; display: block; }
    
    input[type="text"] {
      width: 100%; padding: 10px; background: #0F172A; border: 1px solid #334155;
      color: #F1F5F9; border-radius: 6px; outline: none; margin-bottom: 10px;
    }
    input[type="text"]:focus { border-color: #3B82F6; }
    
    .filter-btn {
      display: block; width: 100%; padding: 8px; margin-bottom: 6px;
      background: #0F172A; border: 1px solid #334155; color: #CBD5E1;
      border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: #334155; }
    .filter-btn.active { background: #3B82F6; border-color: #2563EB; color: #FFF; font-weight: bold; }
    
    .route-btn {
      display: flex; justify-content: space-between; align-items: center; width: 100%; 
      padding: 10px; margin-bottom: 6px; background: #0F172A; border: 1px solid #334155; 
      border-radius: 6px; color: #F1F5F9; cursor: pointer; font-size: 12px; font-weight: bold;
      transition: all 0.2s;
    }
    .route-btn:hover { border-color: #94A3B8; }
    
    #map { flex: 1; height: 100vh; }
    
    /* Estilos Customizados para os Nós (Aeroportos) */
    .airport-node {
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      transition: transform 0.2s ease-out, border-color 0.2s;
    }
    .airport-node:hover {
      transform: scale(1.35);
      border-color: #FFF;
      z-index: 9999 !important;
    }

    /* Tooltips e Animações */
    .leaflet-tooltip {
      background: rgba(15, 23, 42, 0.95) !important; border: 1px solid #334155 !important;
      color: #F1F5F9 !important; border-radius: 8px !important; padding: 10px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
    }
    .leaflet-tooltip::before { display: none !important; }
    .tt-title { font-size: 14px; font-weight: bold; color: #FFF; margin-bottom: 5px; border-bottom: 1px solid #334155; padding-bottom: 3px; }
    .tt-stat { font-size: 11px; color: #94A3B8; margin-bottom: 2px; }
    .tt-stat span { color: #34D399; font-weight: bold; }
    
    .flow { stroke-dasharray: 12 8; animation: flow 1.5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
</head>
<body>

  <div id="sidebar">
    <h1>Rede Aeroportuária</h1>
    <p class="sub">Painel de Exploração Interativa</p>

    <div class="control-group">
      <label>Buscar Aeroporto</label>
      <input type="text" id="searchInput" placeholder="Digite IATA ou Cidade..." onkeyup="applyFilters()">
    </div>

    <div class="control-group">
      <label>Filtrar por Região</label>
      <button class="filter-btn active" data-region="Todas" onclick="toggleRegion(this)">Todas as Regiões</button>
      <button class="filter-btn" data-region="Norte" onclick="toggleRegion(this)">Norte</button>
      <button class="filter-btn" data-region="Nordeste" onclick="toggleRegion(this)">Nordeste</button>
      <button class="filter-btn" data-region="Centro-Oeste" onclick="toggleRegion(this)">Centro-Oeste</button>
      <button class="filter-btn" data-region="Sudeste" onclick="toggleRegion(this)">Sudeste</button>
      <button class="filter-btn" data-region="Sul" onclick="toggleRegion(this)">Sul</button>
    </div>

    <div class="control-group">
      <label>Destacar Rotas (Animadas)</label>
      <div id="routes-container"></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const data = {"nodes": {"REC": {"cidade": "Recife", "regiao": "Nordeste", "lat": -8.13, "lng": -34.92, "grau": 15, "densidade": 0.733333}, "SSA": {"cidade": "Salvador", "regiao": "Nordeste", "lat": -12.91, "lng": -38.32, "grau": 15, "densidade": 0.758333}, "FOR": {"cidade": "Fortaleza", "regiao": "Nordeste", "lat": -3.78, "lng": -38.53, "grau": 11, "densidade": 0.878788}, "NAT": {"cidade": "Natal", "regiao": "Nordeste", "lat": -5.91, "lng": -35.25, "grau": 11, "densidade": 0.924242}, "JPA": {"cidade": "João Pessoa", "regiao": "Nordeste", "lat": -7.15, "lng": -34.95, "grau": 8, "densidade": 1.0}, "GRU": {"cidade": "São Paulo", "regiao": "Sudeste", "lat": -23.44, "lng": -46.47, "grau": 19, "densidade": 0.605263}, "CGH": {"cidade": "São Paulo", "regiao": "Sudeste", "lat": -23.63, "lng": -46.66, "grau": 14, "densidade": 0.771429}, "GIG": {"cidade": "Rio de Janeiro", "regiao": "Sudeste", "lat": -22.81, "lng": -43.25, "grau": 17, "densidade": 0.686275}, "CNF": {"cidade": "Belo Horizonte", "regiao": "Sudeste", "lat": -19.62, "lng": -43.97, "grau": 19, "densidade": 0.605263}, "VIX": {"cidade": "Vitória", "regiao": "Sudeste", "lat": -20.26, "lng": -40.29, "grau": 8, "densidade": 0.944444}, "BSB": {"cidade": "Brasília", "regiao": "Centro-Oeste", "lat": -15.87, "lng": -47.92, "grau": 19, "densidade": 0.605263}, "GYN": {"cidade": "Goiânia", "regiao": "Centro-Oeste", "lat": -16.63, "lng": -49.22, "grau": 8, "densidade": 0.972222}, "CWB": {"cidade": "Curitiba", "regiao": "Sul", "lat": -25.53, "lng": -49.18, "grau": 9, "densidade": 0.933333}, "FLN": {"cidade": "Florianópolis", "regiao": "Sul", "lat": -27.67, "lng": -48.55, "grau": 9, "densidade": 0.888889}, "POA": {"cidade": "Porto Alegre", "regiao": "Sul", "lat": -29.99, "lng": -51.17, "grau": 10, "densidade": 0.909091}, "MAO": {"cidade": "Manaus", "regiao": "Norte", "lat": -3.04, "lng": -60.05, "grau": 13, "densidade": 0.747253}, "BEL": {"cidade": "Belém", "regiao": "Norte", "lat": -1.38, "lng": -48.48, "grau": 9, "densidade": 1.0}, "PVH": {"cidade": "Porto Velho", "regiao": "Norte", "lat": -8.71, "lng": -63.9, "grau": 6, "densidade": 0.952381}, "RBR": {"cidade": "Rio Branco", "regiao": "Norte", "lat": -9.87, "lng": -67.9, "grau": 5, "densidade": 1.0}, "THE": {"cidade": "Teresina", "regiao": "Nordeste", "lat": -5.06, "lng": -42.82, "grau": 5, "densidade": 1.0}}, "edges": [{"source": "REC", "target": "CGH"}, {"source": "REC", "target": "NAT"}, {"source": "REC", "target": "SSA"}, {"source": "REC", "target": "BSB"}, {"source": "REC", "target": "GRU"}, {"source": "REC", "target": "CNF"}, {"source": "REC", "target": "POA"}, {"source": "REC", "target": "GIG"}, {"source": "REC", "target": "GYN"}, {"source": "REC", "target": "FOR"}, {"source": "REC", "target": "JPA"}, {"source": "REC", "target": "MAO"}, {"source": "REC", "target": "BEL"}, {"source": "REC", "target": "THE"}, {"source": "REC", "target": "VIX"}, {"source": "SSA", "target": "BSB"}, {"source": "SSA", "target": "JPA"}, {"source": "SSA", "target": "MAO"}, {"source": "SSA", "target": "GIG"}, {"source": "SSA", "target": "BEL"}, {"source": "SSA", "target": "GRU"}, {"source": "SSA", "target": "POA"}, {"source": "SSA", "target": "CNF"}, {"source": "SSA", "target": "CGH"}, {"source": "SSA", "target": "VIX"}, {"source": "SSA", "target": "FOR"}, {"source": "SSA", "target": "NAT"}, {"source": "SSA", "target": "CWB"}, {"source": "SSA", "target": "GYN"}, {"source": "FOR", "target": "CNF"}, {"source": "FOR", "target": "CGH"}, {"source": "FOR", "target": "BSB"}, {"source": "FOR", "target": "GIG"}, {"source": "FOR", "target": "GRU"}, {"source": "FOR", "target": "BEL"}, {"source": "FOR", "target": "THE"}, {"source": "FOR", "target": "NAT"}, {"source": "FOR", "target": "MAO"}, {"source": "NAT", "target": "BSB"}, {"source": "NAT", "target": "GIG"}, {"source": "NAT", "target": "GRU"}, {"source": "NAT", "target": "CNF"}, {"source": "NAT", "target": "CGH"}, {"source": "NAT", "target": "BEL"}, {"source": "NAT", "target": "MAO"}, {"source": "NAT", "target": "JPA"}, {"source": "JPA", "target": "BSB"}, {"source": "JPA", "target": "CGH"}, {"source": "JPA", "target": "GRU"}, {"source": "JPA", "target": "GIG"}, {"source": "JPA", "target": "CNF"}, {"source": "GRU", "target": "BSB"}, {"source": "GRU", "target": "VIX"}, {"source": "GRU", "target": "CNF"}, {"source": "GRU", "target": "POA"}, {"source": "GRU", "target": "CWB"}, {"source": "GRU", "target": "GIG"}, {"source": "GRU", "target": "MAO"}, {"source": "GRU", "target": "GYN"}, {"source": "GRU", "target": "THE"}, {"source": "GRU", "target": "BEL"}, {"source": "GRU", "target": "FLN"}, {"source": "GRU", "target": "PVH"}, {"source": "GRU", "target": "RBR"}, {"source": "GRU", "target": "CGH"}, {"source": "CGH", "target": "CNF"}, {"source": "CGH", "target": "VIX"}, {"source": "CGH", "target": "FLN"}, {"source": "CGH", "target": "BSB"}, {"source": "CGH", "target": "GYN"}, {"source": "CGH", "target": "POA"}, {"source": "CGH", "target": "GIG"}, {"source": "CGH", "target": "CWB"}, {"source": "GIG", "target": "MAO"}, {"source": "GIG", "target": "POA"}, {"source": "GIG", "target": "VIX"}, {"source": "GIG", "target": "BSB"}, {"source": "GIG", "target": "CWB"}, {"source": "GIG", "target": "FLN"}, {"source": "GIG", "target": "CNF"}, {"source": "GIG", "target": "GYN"}, {"source": "GIG", "target": "BEL"}, {"source": "GIG", "target": "PVH"}, {"source": "CNF", "target": "BSB"}, {"source": "CNF", "target": "VIX"}, {"source": "CNF", "target": "MAO"}, {"source": "CNF", "target": "GYN"}, {"source": "CNF", "target": "POA"}, {"source": "CNF", "target": "FLN"}, {"source": "CNF", "target": "CWB"}, {"source": "CNF", "target": "PVH"}, {"source": "CNF", "target": "RBR"}, {"source": "CNF", "target": "BEL"}, {"source": "CNF", "target": "THE"}, {"source": "VIX", "target": "BSB"}, {"source": "VIX", "target": "FLN"}, {"source": "BSB", "target": "MAO"}, {"source": "BSB", "target": "POA"}, {"source": "BSB", "target": "GYN"}, {"source": "BSB", "target": "BEL"}, {"source": "BSB", "target": "FLN"}, {"source": "BSB", "target": "CWB"}, {"source": "BSB", "target": "PVH"}, {"source": "BSB", "target": "THE"}, {"source": "BSB", "target": "RBR"}, {"source": "GYN", "target": "CWB"}, {"source": "CWB", "target": "FLN"}, {"source": "CWB", "target": "POA"}, {"source": "FLN", "target": "MAO"}, {"source": "FLN", "target": "POA"}, {"source": "POA", "target": "MAO"}, {"source": "MAO", "target": "PVH"}, {"source": "MAO", "target": "BEL"}, {"source": "MAO", "target": "RBR"}, {"source": "PVH", "target": "RBR"}], "routes": [{"id": "rec-poa", "label": "⭐ REC → POA", "path": ["REC", "POA"], "color": "#A855F7"}, {"id": "mao-gru", "label": "⭐ MAO → GRU", "path": ["MAO", "GRU"], "color": "#F472B6"}, {"id": "for-cgh", "label": "FOR → CGH", "path": ["FOR", "CGH"], "color": "#34D399"}, {"id": "bsb-bel", "label": "BSB → BEL", "path": ["BSB", "BEL"], "color": "#60A5FA"}, {"id": "cwb-nat", "label": "CWB → NAT", "path": ["CWB", "GRU", "NAT"], "color": "#FBBF24"}, {"id": "vix-mao", "label": "VIX → MAO", "path": ["VIX", "CNF", "MAO"], "color": "#F87171"}, {"id": "ssa-fln", "label": "SSA → FLN", "path": ["SSA", "GIG", "FLN"], "color": "#67E8F9"}]};
    const REGION_COLORS = { "Norte": "#34D399", "Nordeste": "#FBBF24", "Sudeste": "#60A5FA", "Sul": "#F472B6", "Centro-Oeste": "#A855F7" };
    
    const map = L.map('map', {zoomControl: true}).setView([-15, -50], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap', subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    let nodeLayers = [];
    let edgeLayers = [];
    let currentRegion = 'Todas';
    let activeRoutes = new Set();
    
    const routesGroup = L.layerGroup().addTo(map);

    const routesContainer = document.getElementById('routes-container');
    data.routes.forEach(route => {
      const btn = document.createElement('button');
      btn.className = 'route-btn';
      btn.innerHTML = `<span>${route.label}</span> <span style="color:${route.color}">■</span>`;
      btn.onclick = () => toggleRoute(route, btn);
      routesContainer.appendChild(btn);
    });

    function arc(la1, ln1, la2, ln2, n=50) {
      const mla=(la1+la2)/2, mln=(ln1+ln2)/2, dla=la2-la1, dln=ln2-ln1;
      const dist=Math.hypot(dla,dln)||1e-9, k=dist*0.2;
      const cla=mla+(-dln/dist)*k, cln=mln+(dla/dist)*k;
      return Array.from({length:n+1}, (_,i) => {
        const t=i/n, u=1-t;
        return [u*u*la1 + 2*u*t*cla + t*t*la2, u*u*ln1 + 2*u*t*cln + t*t*ln2];
      });
    }

    // Arestas Base (Fundo)
    data.edges.forEach(edge => {
      const p1 = [data.nodes[edge.source].lat, data.nodes[edge.source].lng];
      const p2 = [data.nodes[edge.target].lat, data.nodes[edge.target].lng];
      const line = L.polyline([p1, p2], { color: '#475569', weight: 1, opacity: 0.3 }).addTo(map);
      edgeLayers.push({ source: edge.source, target: edge.target, layer: line });
    });

    // Nós Customizados (Aeroportos) com Glow
    Object.keys(data.nodes).forEach(iata => {
      const n = data.nodes[iata];
      const color = REGION_COLORS[n.regiao] || '#FFF';
      const size = 10 + (n.grau * 1.5); // Tamanho dinâmico pelo grau
      
      const iconHTML = `<div class="airport-node" style="
        width: 100%; height: 100%; 
        background: ${color}; 
        box-shadow: 0 0 ${size/1.5}px ${color};
      "></div>`;

      const customIcon = L.divIcon({
        className: '', // Limpa a classe padrão do leaflet
        html: iconHTML,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2]
      });

      const marker = L.marker([n.lat, n.lng], { icon: customIcon }).addTo(map);

      const tooltipHTML = `
        <div class="tt-title">${iata} - ${n.cidade}</div>
        <div class="tt-stat">Região: <span>${n.regiao}</span></div>
        <div class="tt-stat">Grau: <span>${n.grau} conexões</span></div>
        <div class="tt-stat">Densidade Ego: <span>${n.densidade.toFixed(4)}</span></div>
      `;
      marker.bindTooltip(tooltipHTML, { direction: 'top', offset: [0, -(size/2)] });
      nodeLayers.push({ iata: iata, data: n, layer: marker });
    });

    function applyFilters() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      nodeLayers.forEach(node => {
        const matchSearch = node.iata.toLowerCase().includes(term) || node.data.cidade.toLowerCase().includes(term);
        const matchRegion = currentRegion === 'Todas' || node.data.regiao === currentRegion;
        if (matchSearch && matchRegion) { map.addLayer(node.layer); } 
        else { map.removeLayer(node.layer); }
      });
      updateEdgesVisibility();
    }

    function updateEdgesVisibility() {
      edgeLayers.forEach(edge => {
        const sourceVisible = map.hasLayer(nodeLayers.find(n => n.iata === edge.source).layer);
        const targetVisible = map.hasLayer(nodeLayers.find(n => n.iata === edge.target).layer);
        if (sourceVisible && targetVisible) { map.addLayer(edge.layer); } 
        else { map.removeLayer(edge.layer); }
      });
    }

    window.toggleRegion = function(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRegion = btn.getAttribute('data-region');
      applyFilters();
    };

    window.toggleRoute = function(route, btn) {
      if (activeRoutes.has(route.id)) {
        activeRoutes.delete(route.id);
        btn.style.backgroundColor = '#0F172A';
        btn.style.borderColor = '#334155';
      } else {
        activeRoutes.add(route.id);
        btn.style.backgroundColor = 'rgba(255,255,255,0.1)';
        btn.style.borderColor = route.color;
      }
      renderActiveRoutes();
    };

    function renderActiveRoutes() {
      routesGroup.clearLayers();
      activeRoutes.forEach(routeId => {
        const route = data.routes.find(r => r.id === routeId);
        for(let i = 0; i < route.path.length - 1; i++) {
          const a = data.nodes[route.path[i]], b = data.nodes[route.path[i+1]];
          const pts = arc(a.lat, a.lng, b.lat, b.lng);
          L.polyline(pts, {color: route.color, weight: 8, opacity: 0.3, smoothFactor: 1}).addTo(routesGroup);
          L.polyline(pts, {color: route.color, weight: 3, opacity: 0.9, className: 'flow'}).addTo(routesGroup);
        }
      });
    }
  </script>
</body>
</html>
